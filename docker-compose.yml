# Use Docker Compose file format version 3.8 (standard for modern Docker engines)
version: '3.8'

services:
  # Define our web application service
  web:
    # Build the Docker image using the Dockerfile in the current directory
    build: .
    # Map port 3000 on your host machine to port 3000 inside the container
    ports:
      - "3000:3000"
    # Set environment variables inside the container
    environment:
      - PORT=3000
    # Automatically restart the container if it crashes or the Docker daemon restarts
    restart: unless-stopped